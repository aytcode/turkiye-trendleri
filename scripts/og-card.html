<!doctype html>
<!-- Sosyal medya önizleme görseli (1200x630) kaynağı. docs/assets/og.png bundan üretilir: scripts/screenshots.ps1 -->
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Display", Inter, system-ui, sans-serif;
    font-optical-sizing: auto;
    background: #000; color: #f5f5f7;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; color: #a1a1a6; letter-spacing: -.01em; }
  .live { width: 12px; height: 12px; border-radius: 50%; background: #ff375f; }
  h1 { margin: 22px 0 0; font-size: 92px; line-height: 1.02; font-weight: 700; letter-spacing: -.035em; }
  h1 span { color: #86868b; }
  .dots { display: flex; gap: 26px; margin-top: 48px; font-size: 22px; color: #a1a1a6; letter-spacing: -.005em; }
  .dots span { display: inline-flex; align-items: center; gap: 9px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; }
</style>
</head>
<body>
  <div class="eyebrow"><i class="live"></i>Haftalık trend raporu · 2026</div>
  <h1>Türkiye'nin gündemi.<br><span>Her hafta, tek sayfada.</span></h1>
  <div class="dots">
    <span><i style="background:#536471"></i>X</span>
    <span><i style="background:#14B8C4"></i>TikTok</span>
    <span><i style="background:#E1306C"></i>Instagram</span>
    <span><i style="background:#FF0033"></i>YouTube</span>
    <span><i style="background:#4285F4"></i>Google</span>
    <span><i style="background:#8E8E93"></i>Vikipedi</span>
  </div>
</body>
</html>
