<!doctype html>
<!-- Sosyal medya önizleme görseli (1200x630) kaynağı. docs/assets/og.png bundan üretilir:
     msedge --headless=new --window-size=1200,630 --screenshot=docs/assets/og.png scripts/og-card.html -->
<html lang="tr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: Inter, system-ui, sans-serif; color: #fff;
    background: radial-gradient(circle at 85% 20%, #3a0d12 0, transparent 45%), #0d1014;
    display: flex; flex-direction: column; justify-content: center; padding: 0 80px; box-sizing: border-box;
  }
  .eyebrow { font-size: 26px; font-weight: 700; color: #ff4655; letter-spacing: .08em; text-transform: uppercase; }
  h1 { font-size: 76px; line-height: 1.04; margin: 18px 0 26px; font-weight: 800; letter-spacing: -.03em; }
  h1 span { color: #ff4655; }
  p { font-size: 30px; color: #98a1ad; margin: 0 0 40px; font-weight: 500; }
  .chips { position: relative; display: flex; gap: 14px; flex-wrap: wrap; }
  .chip { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px; background: #161a20; border: 1px solid #262c35; font-size: 21px; font-weight: 700; }
  .chip i { width: 14px; height: 14px; border-radius: 50%; }
  .bars { position: absolute; right: 80px; bottom: 0; display: flex; align-items: flex-end; gap: 14px; height: 190px; opacity: .3; }
  .bars b { width: 34px; border-radius: 6px 6px 0 0; }
</style>
</head>
<body>
  <div class="bars">
    <b style="height:40%;background:#536471"></b><b style="height:65%;background:#25F4EE"></b><b style="height:50%;background:#E1306C"></b>
    <b style="height:100%;background:#FF0033"></b><b style="height:80%;background:#4285F4"></b><b style="height:58%;background:#7A7A7A"></b>
  </div>
  <div class="eyebrow">Haftalık trend raporu</div>
  <h1>Türkiye'de en popüler<br><span>2026</span> trendleri</h1>
  <p>Her hafta otomatik · açık kaynak · grafikli rapor</p>
  <div class="chips">
    <span class="chip"><i style="background:#536471"></i>X</span>
    <span class="chip"><i style="background:#25F4EE"></i>TikTok</span>
    <span class="chip"><i style="background:#E1306C"></i>Instagram</span>
    <span class="chip"><i style="background:#FF0033"></i>YouTube</span>
    <span class="chip"><i style="background:#4285F4"></i>Google Trends</span>
    <span class="chip"><i style="background:#7A7A7A"></i>Vikipedi</span>
  </div>
</body>
</html>
